name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and test the C++ secure element
        run: |
          cmake -S native/secure-element -B native/secure-element/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/secure-element/build
          ctest --test-dir native/secure-element/build --output-on-failure
      - uses: actions/setup-go@v5
        with:
          go-version-file: chaincode/erupee-utxo/go.mod
          cache-dependency-path: chaincode/erupee-utxo/go.sum
      - name: Test the Hyperledger Fabric chaincode (Go)
        working-directory: chaincode/erupee-utxo
        run: go vet ./... && go test ./... -count=1
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
